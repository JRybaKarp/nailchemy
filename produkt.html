<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nailchemy — Alchemia koloru na końcach Twoich palców</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

<!-- OFFCANVAS KOSZYK -->
<div class="offcanvas offcanvas-end offcanvas-custom" tabindex="-1" id="cartDrawer">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title"><i class="fa-solid fa-bag-shopping text-primary-brand"></i> Twój Koszyk</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column p-0">
        <div class="p-3 flex-grow-1 overflow-y-auto" id="cartDrawerItemsList"></div>
        <div class="cart-drawer-footer">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-white-50">Suma:</span>
                <span class="h5 mb-0 text-accent fw-bold" id="cartDrawerSubtotal">64,80 PLN</span>
            </div>
            <a href="koszyk.html" class="btn btn-hero-solid w-100 py-2 text-decoration-none text-center">Przejdź do pełnego koszyka</a>
        </div>
    </div>
</div>

    
    
    <div class="container py-5">
        <a href="sklep.html" class="btn btn-sm btn-outline-light mb-4 rounded-pill px-3 text-decoration-none"><i class="fa-solid fa-arrow-left me-2"></i> Powrót do sklepu</a>
        <div class="row g-5 align-items-center">
            <div class="col-lg-6">
                <div style="background: var(--bg-card); border: 1px solid rgba(191, 142, 160, 0.25); border-radius: 22px; overflow: hidden; height: 450px;">
                    <img src="https://images.unsplash.com/photo-1608248597309-a74f4c2c5251?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%; height:100%; object-fit:cover;">
                </div>
            </div>
            <div class="col-lg-6">
                <h2 class="display-6 mb-2 text-accent" style="font-family: var(--font-heading);">Base Construction Rose</h2>
                <div class="h3 text-accent fw-bold mb-4">39,90 PLN</div>
                <p class="text-white-50 mb-4">Samopoziomująca baza budująca o odcieniu pudrowego różu, zapewniająca trwałość do 21 dni.</p>
                <button class="btn-hero-solid px-4 py-3" onclick="showToast('Dodano do koszyka!')"><i class="fa-solid fa-bag-shopping me-2"></i> Do koszyka</button>
            </div>
        </div>
    </div>


    <div id="footer-placeholder"></div>

<div id="toastContainer" class="position-fixed bottom-0 end-0 p-4 d-flex flex-column gap-2" style="z-index: 1090; pointer-events: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'nailchemy-toast';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-primary-brand fs-5"></i><div>${msg}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
    
    <script src="includes.js"></script>
</body>
</html>
