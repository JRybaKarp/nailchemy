<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nailchemy — Alchemia koloru na końcach Twoich palców</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

<!-- OFFCANVAS KOSZYK -->
<div class="offcanvas offcanvas-end offcanvas-custom" tabindex="-1" id="cartDrawer">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title"><i class="fa-solid fa-bag-shopping text-primary-brand"></i> Twój Koszyk</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column p-0">
        <div class="p-3 flex-grow-1 overflow-y-auto" id="cartDrawerItemsList"></div>
        <div class="cart-drawer-footer">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-white-50">Suma:</span>
                <span class="h5 mb-0 text-accent fw-bold" id="cartDrawerSubtotal">64,80 PLN</span>
            </div>
            <a href="koszyk.html" class="btn btn-hero-solid w-100 py-2 text-decoration-none text-center">Przejdź do pełnego koszyka</a>
        </div>
    </div>
</div>

    
    
    <div class="container py-5">
        <div class="section-title-wrapper mb-4">
            <h2>Sklep Nailchemy</h2>
            <p class="text-white-50">Pełen asortyment profesjonalnych kosmetyków</p>
        </div>
        <div class="row g-4" id="shopProductsGrid"></div>
    </div>
    <script>
        const productsData = [
            { id: 1, name: "Base Construction Rose — Baza Budująca", price: 39.90, badge: "Top Bestseller", img: "https://images.unsplash.com/photo-1608248597309-a74f4c2c5251?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "Primer Bezkwasowy Acid-Free 15ml", price: 24.90, badge: "Hit", img: "https://images.unsplash.com/photo-1519014816548-bf5fe059798b?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "Cover Pink Builder Gel — Żel Budujący 50g", price: 65.00, badge: "Nowość", img: "https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "Velvet Matte Top Coat — Top Matowy 10ml", price: 29.90, badge: "Bestseller", img: "https://images.unsplash.com/photo-1632345031435-8727f6897d53?auto=format&fit=crop&w=500&q=80" },
            { id: 5, name: "Cleaner Extra Clean — Odtłuszczacz 500ml", price: 22.00, badge: null, img: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=500&q=80" }
        ];

        function renderShopGrid() {
            const grid = document.getElementById('shopProductsGrid');
            if (!grid) return;
            grid.innerHTML = productsData.map(p => `
                <div class="col-lg-4 col-md-6">
                    <div class="product-card-ecommerce">
                        <div class="product-card-img-wrap">
                            ${p.badge ? `<span class="product-badge-promo">${p.badge}</span>` : ''}
                            <img src="${p.img}" alt="">
                        </div>
                        <div class="product-card-body">
                            <h4 class="product-title-ec">${p.name}</h4>
                            <div class="h5 text-accent fw-bold mb-3">${p.price.toFixed(2).replace('.', ',')} PLN</div>
                            <a href="produkt.html" class="btn btn-sm btn-hero-solid rounded-pill w-100 text-decoration-none text-center">Szczegóły / Do koszyka</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', renderShopGrid);
    </script>


    <div id="footer-placeholder"></div>

<div id="toastContainer" class="position-fixed bottom-0 end-0 p-4 d-flex flex-column gap-2" style="z-index: 1090; pointer-events: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'nailchemy-toast';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-primary-brand fs-5"></i><div>${msg}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
    
    <script src="includes.js"></script>
</body>
</html>
